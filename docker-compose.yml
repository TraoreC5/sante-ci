version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sante-ci-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sante_ci
      POSTGRES_PASSWORD: sante_ci_dev_2024
      POSTGRES_DB: sante_ci
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sante_ci -d sante_ci']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sante-ci-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sante-ci.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - '5050:5050'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
